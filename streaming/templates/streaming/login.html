<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SoundStream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        .bg-spotify-dark { background-color: #070707; }
        .text-spotify-green { color: #1DB954; }
        .card-spotify {
            background-color: #181818;
            border: 1px solid #282828;
            border-radius: 12px;
        }
        .form-label {
            color: #ffffff !important;
            font-weight: 500;
        }
        .form-control-spotify {
            background-color: #242424 !important;
            border: 1px solid #3e3e3e !important;
            color: #ffffff !important;
            border-radius: 6px;
        }
        .form-control-spotify:focus {
            border-color: #1DB954 !important;
            box-shadow: 0 0 0 0.25rem rgba(29, 185, 84, 0.25) !important;
            background-color: #2a2a2a !important;
            color: #ffffff !important;
        }
        /* Marcadores de posición de alta visibilidad */
        .form-control-spotify::placeholder {
            color: #a0a0a0 !important;
        }
        .btn-spotify {
            background-color: #1DB954;
            color: #ffffff;
            border-radius: 50px;
            font-weight: 600;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-spotify:hover {
            background-color: #1ed760;
            color: #ffffff;
        }
        .text-muted-custom {
            color: #b3b3b3 !important;
        }
    </style>
</head>
<body>

    <div class="container my-5">
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-dark border-secondary text-white alert-dismissible fade show shadow mb-4 mx-auto" style="max-width: 500px;" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="row justify-content-center pt-5">
            <div class="col-md-5">
                <div class="card card-spotify p-5 shadow">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-white">Iniciar Sesión</h2>
                        <p class="text-muted-custom small">Accede a tu plataforma de Streaming de Base de Datos II</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Nombre de Usuario</label>
                            <input type="text" name="username" class="form-control form-control-spotify" required placeholder="Ej: Miguel">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña del Sistema</label>
                            <input type="password" name="password" class="form-control form-control-spotify" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-spotify w-100 py-2.5 mb-3">Entrar al Sistema</button>
                        
                        <div class="text-center">
                            <a href="#" class="text-spotify-green text-decoration-none small">¿Olvidaste tu contraseña?</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
