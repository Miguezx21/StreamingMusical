<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ accion }} Usuario - SoundStream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        .bg-spotify-dark { background-color: #070707; }
        .text-spotify-green { color: #1DB954; }
        .card-spotify {
            background-color: #181818;
            border: 1px solid #282828;
            border-radius: 12px;
        }
        /* Forzar etiquetas visibles */
        .form-label {
            color: #ffffff !important;
            font-weight: 500;
            font-size: 0.9rem;
        }
        /* Inputs estilizados oscuros con texto blanco */
        .form-control-spotify {
            background-color: #242424 !important;
            border: 1px solid #3e3e3e !important;
            color: #ffffff !important;
            border-radius: 6px;
        }
        .form-control-spotify:focus {
            border-color: #1DB954 !important;
            box-shadow: 0 0 0 0.25rem rgba(29, 185, 84, 0.25) !important;
            background-color: #2a2a2a !important;
            color: #ffffff !important;
        }
        /* Color del marcador de posición */
        .form-control-spotify::placeholder {
            color: #727272 !important;
        }
        .btn-spotify {
            background-color: #1DB954;
            color: #ffffff;
            border-radius: 50px;
            font-weight: 600;
            border: none;
        }
        .btn-spotify:hover {
            background-color: #1ed760;
            color: #ffffff;
        }
        .btn-cancelar {
            border: 1px solid #535353;
            color: #ffffff;
            border-radius: 50px;
        }
        .btn-cancelar:hover {
            background-color: #242424;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-spotify-dark border-bottom border-secondary py-3">
        <div class="container">
            <span class="navbar-brand fw-bold text-spotify-green fs-4">SoundStream Consola</span>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-spotify p-5 shadow">
                    
                    <h2 class="fw-bold text-spotify-green mb-4">{{ accion }} Registro de Usuario</h2>
                    <hr class="border-secondary mb-4">

                    <form method="POST">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">ID único (Primary Key)</label>
                                <input type="number" name="idpersona" class="form-control form-control-spotify" required value="{{ persona.idpersona }}" {% if accion == 'Editar' %}readonly{% endif %} placeholder="Ej: 45">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" name="password" class="form-control form-control-spotify" required value="{{ persona.password }}" placeholder="••••••••">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" name="nombre" class="form-control form-control-spotify" required value="{{ persona.nombre }}" placeholder="Ej: Juan">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Apellido</label>
                                <input type="text" name="apellido" class="form-control form-control-spotify" required value="{{ persona.apellido }}" placeholder="Ej: Pérez">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Género</label>
                                <input type="text" name="genero" class="form-control form-control-spotify" maxlength="1" required value="{{ persona.genero }}" placeholder="M / F / O">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">País de Origen</label>
                                <input type="text" name="paisorigen" class="form-control form-control-spotify" required value="{{ persona.paisorigen }}" placeholder="Ej: Ecuador">
                            </div>
                            <div class="col-md-12 mb-4">
                                <label class="form-label">Fecha de Registro</label>
                                <input type="date" name="fecharegistro" class="form-control form-control-spotify" required value="{{ persona.fecharegistro|date:'Y-m-d' }}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-3 mt-2">
                            <a href="{% url 'index' %}" class="btn btn-cancelar px-4 py-2">Cancelar</a>
                            <button type="submit" class="btn btn-spotify px-4 py-2">Guardar Cambios</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
