<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SoundStream{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        .text-muted {
            color: #b3b3b3 !important;
        }
        .bg-spotify-dark { background-color: #040404; }
        .text-spotify-green { color: #1DB954; }
        .btn-spotify {
            background-color: #1DB954;
            color: #ffffff;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-spotify:hover {
            background-color: #1ed760;
            color: #ffffff;
            transform: scale(1.03);
        }
        .card-spotify {
            background-color: #181818;
            border: 1px solid #282828;
            border-radius: 8px;
        }
        .form-control-spotify {
            background-color: #2a2a2a;
            border: 1px solid #3e3e3e;
            color: white;
        }
        .form-control-spotify:focus {
            background-color: #333333;
            border-color: #1DB954;
            color: white;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-spotify-dark border-bottom border-secondary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-spotify-green" href="{% url 'mongo:index' %}">
                <i class="fa-solid fa-circle-play me-2"></i>SoundStream
            </a>
            <button class="navbar-collapse collapse"></button>
            <div class="d-flex align-items-center gap-3">
                {% if request.session.usuario_id %}
                    <span class="text-muted small"><i class="fa-solid fa-user text-spotify-green me-1"></i>{{ request.session.usuario_nombre }}</span>
                    <a href="{% url 'mongo:logout' %}" class="btn btn-sm btn-outline-danger px-3 rounded-pill">Salir</a>
                {% else %}
                    <a href="{% url 'mongo:login' %}" class="btn btn-sm btn-spotify px-4">Iniciar Sesión</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container my-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-dark border-success text-white alert-dismissible fade show" role="alert">
                    <i class="fa-solid fa-circle-info text-spotify-green me-2"></i>{{ message }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
